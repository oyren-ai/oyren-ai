name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

env:
  DO_SPACES_BUCKET: oyren-ai-tauri-binaries
  DO_SPACES_ENDPOINT: https://fra1.digitaloceanspaces.com

jobs:
  build:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            folder: macos/arm
            updater_platform: darwin-aarch64
          - target: x86_64-apple-darwin
            folder: macos/x86
            updater_platform: darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload to DigitalOcean Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_WORKSPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_WORKSPACES_SECRET }}
        run: |
          VERSION="${{ inputs.version }}"
          FOLDER="${{ matrix.folder }}"
          BUNDLE_DIR=$(find src-tauri/target -path "*/release/bundle" -type d | head -1)
          echo "Found bundle dir: $BUNDLE_DIR"
          ls -R "$BUNDLE_DIR"

          for f in $(find "$BUNDLE_DIR" -name "*.dmg" -o -name "*.tar.gz" -o -name "*.tar.gz.sig"); do
            echo "Uploading $(basename $f) to $VERSION/$FOLDER/"
            aws s3 cp "$f" "s3://$DO_SPACES_BUCKET/$VERSION/$FOLDER/$(basename $f)" \
              --endpoint-url "$DO_SPACES_ENDPOINT" --acl public-read
          done

      - name: Save updater signature
        run: |
          BUNDLE_DIR=$(find src-tauri/target -path "*/release/bundle" -type d | head -1)
          mkdir -p /tmp/updater-sigs
          SIG_FILE=$(find "$BUNDLE_DIR" -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$SIG_FILE" ]; then
            cp "$SIG_FILE" /tmp/updater-sigs/${{ matrix.updater_platform }}.sig
          fi

      - name: Upload signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.updater_platform }}
          path: /tmp/updater-sigs/
          if-no-files-found: warn

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: oyren-desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn
