<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyren - Academic IDE</title>
    <style>
      * {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Ambient glow */
      .splash-glow {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
        animation: glow-pulse 2s ease-in-out infinite;
      }

      /* Logo container */
      .splash-logo-container {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        position: relative;
      }
      .splash-logo-svg {
        width: 64px;
        height: 64px;
      }

      /* Stroke draw animation */
      .splash-logo-stroke {
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: stroke-draw 800ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      /* Fill reveal via clipPath */
      .splash-fill-rect {
        transform: translateX(-128px);
        animation: fill-reveal 600ms ease-out 600ms forwards;
      }
      .splash-logo-fill {
        opacity: 1;
      }

      /* Stroke fades out after fill appears */
      .splash-logo-stroke {
        animation: stroke-draw 800ms cubic-bezier(0.65, 0, 0.35, 1) forwards,
                   stroke-fade 400ms ease-out 900ms forwards;
      }

      /* Text materializing */
      .splash-logo-text {
        font-size: 44px;
        font-weight: 300;
        color: #ffffff;
        letter-spacing: 6px;
        filter: blur(4px);
        opacity: 0;
        transform: translateY(8px);
        animation: text-reveal 500ms cubic-bezier(0.16, 1, 0.3, 1) 1000ms forwards;
      }

      /* Tagline */
      .splash-tagline {
        font-size: 16px;
        color: #a0a0a0;
        margin-bottom: 48px;
        opacity: 0;
        transform: translateY(6px);
        animation: tagline-reveal 500ms ease-out 1200ms forwards;
      }

      /* Progress bar */
      .splash-progress-track {
        width: 200px;
        height: 2px;
        background: rgba(255,255,255,0.08);
        border-radius: 1px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress-fill {
        width: 0%;
        height: 100%;
        background: rgba(255,255,255,0.7);
        border-radius: 1px;
        animation: progress-fill 2200ms cubic-bezier(0.4, 0, 0.2, 1) 1000ms forwards;
        position: relative;
      }
      .splash-progress-fill::after {
        content: '';
        position: absolute;
        right: 0;
        top: -1px;
        width: 20px;
        height: 4px;
        background: radial-gradient(ellipse at right, rgba(255,255,255,0.6), transparent);
        filter: blur(1px);
      }

      /* Keyframes */
      @keyframes stroke-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fill-reveal {
        to { transform: translateX(0); }
      }
      @keyframes stroke-fade {
        to { opacity: 0; }
      }
      @keyframes text-reveal {
        to {
          letter-spacing: -1px;
          filter: blur(0);
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes tagline-reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes progress-fill {
        to { width: 100%; }
      }
      @keyframes glow-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 1; }
      }

      /* Accessibility: reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo-stroke,
        .splash-fill-rect,
        .splash-logo-fill,
        .splash-logo-text,
        .splash-tagline,
        .splash-progress-fill,
        .splash-glow {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <div class="splash-glow"></div>
      <div class="splash-logo-container">
        <svg class="splash-logo-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logo-fill-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#d4d4d8"/>
            </linearGradient>
            <clipPath id="fill-reveal">
              <rect class="splash-fill-rect" x="0" y="0" width="128" height="128"/>
            </clipPath>
          </defs>
          <path class="splash-logo-stroke" d="M53.165 11L73.835 32.529V11H92.2084V76.6739L73.835 58.5992L53.165 37.8601V117H34.7917V11H53.165Z" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
          <path class="splash-logo-fill" d="M53.165 11L73.835 32.529V11H92.2084V76.6739L73.835 58.5992L53.165 37.8601V117H34.7917V11H53.165Z" fill="url(#logo-fill-gradient)" clip-path="url(#fill-reveal)"/>
        </svg>
        <div class="splash-logo-text">Oyren.AI</div>
      </div>
      <div class="splash-tagline">Integrated Learning Environment</div>
      <div class="splash-progress-track">
        <div class="splash-progress-fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
