[package]
name = "oyren"
version = "0.1.0"
description = "Oyren - Academic IDE for students and researchers"
authors = ["Oyren Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oyren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
open = "5.0"
pdf-extract = "0.7"
regex = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
zip = "0.6"
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "migrate"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
# Force bundled sqlite to avoid DLL version mismatches (Fixes 0xc0000139)
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "json", "env-filter"] }
tauri-plugin-devtools = { version = "2", optional = true }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true         # Enable Link Time Optimization
codegen-units = 1  # Reduce parallel codegen units to improve optimizations
strip = true       # Strip symbols from binary
panic = "abort"    # Reduce binary size by aborting on panic

[features]
default = []
devtools = ["tauri/devtools", "tauri-plugin-devtools"]

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
mockall = "0.11"
tempfile = "3.8"
tauri = { version = "2", features = ["test"] }
sysinfo = "0.37.2"

# Coverage configuration for cargo-tarpaulin
# Can be added to tarpauling.toml file
# Excludes test utilities and test-only code from coverage reports
[package.metadata.tarpaulin]
# Exclude test utility files that provide shared test infrastructure
# These files are never used in production and shouldn't affect coverage metrics
exclude-files = [
    "src/adapters/db/test_utils.rs",     # Shared database setup for tests
    "src/adapters/db/sqlite_test.rs",    # SQLite-specific test utilities
]
